[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "constructs-3d"
version = "0.1.0"
description = "Validate a JSON or YAML-subset description of a construct (a product made of simple parts) and write one standalone interactive three.js HTML file. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["three.js", "3d", "visualization", "cli", "product"]

[project.scripts]
constructs-3d = "constructs_3d.cli:main"

[tool.setuptools]
packages = ["constructs_3d"]

[tool.setuptools.package-data]
constructs_3d = ["vendor/*"]
